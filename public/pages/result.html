<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Result - Online Examination</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/result.css">
</head>
<body>
  <main class="result-page">
    <section class="card result-card">
      <p id="resultNote" class="muted"></p>
      <div class="score"><span id="scoreNum"></span><span class="score-total" id="scoreTotal"></span></div>
      <p id="resultPercent" class="percent"></p>
      <p id="resultStatus" class="status"></p>

      <h3>Answer review</h3>
      <ol id="reviewList" class="review"></ol>

      <button id="logoutBtn" class="btn primary">Finish</button>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/result.js"></script>
</body>
</html>
